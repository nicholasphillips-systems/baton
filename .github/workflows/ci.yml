name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run isolated workflow tests
        run: python -m unittest discover -s tests -v
      - name: Check public assets
        run: |
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          assert not any(path.lower().endswith('.svg') for path in files), 'Use PNG assets.'
          PY
  shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Lint shell commands
        run: shellcheck -S warning install.sh desktop/launch-ai
